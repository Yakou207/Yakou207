name: Farm clock

on:
  schedule:
    # Hourly, at an off-peak minute: top-of-the-hour jobs get queued for hours. The scripts
    # work out day/night and the date from the clock, and we only commit when something changed.
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['assets/*-day.svg', 'assets/*-night.svg', '.github/hud/**', '.github/day-night.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pick the scene for the current UTC hour
        id: pick
        run: echo "scene=$(bash .github/day-night.sh)" >> "$GITHUB_OUTPUT"
      - name: Update the farm calendar and stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/hud/hud.py
      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero.svg assets/cat.svg assets/ai-hotbar.svg assets/board.svg assets/hud.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Farm: ${{ steps.pick.outputs.scene }}, $(date -u +%F)"
          git push
